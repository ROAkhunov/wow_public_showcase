{#
  Каркас всех страниц витрины. Стили — один файл дизайн-системы, второго набора
  в репозитории не заводим: страниц в релизе сотни тысяч, и каждая новая иначе
  переизобретала бы оформление.

  Клиентского JS здесь нет и быть не должно: тест шва 3 проверяет отсутствие
  тега <script> в теле ответа, а не подразумевает его.
#}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Fomobase{% endblock %}</title>
<meta name="description" content="{% block description %}Аудитория, охваты и реклама каналов по данным открытых источников.{% endblock %}">
{% if noindex %}<meta name="robots" content="noindex,nofollow">{% endif %}
<link rel="canonical" href="{{ settings.site_origin }}{% block canonical %}{{ request.url.path }}{% endblock %}">
<link rel="stylesheet" href="/assets/index.css">
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a class="logo" href="/"><span class="logo-mark">F</span> Fomobase</a>
    <nav class="nav">
      {% for p in platforms %}<a href="/{{ p }}">{{ platform_names[p] }}</a>{% endfor %}
    </nav>
  </div>
</header>

<main class="wrap">
{% block body %}{% endblock %}
</main>

<footer class="sec wrap">
  <p class="sub">Данные собраны из открытых источников. Цифры обновляются раз в сутки.</p>
  {% if built_at %}<p class="updated">Данные обновлены {{ built_at | date_ru }}</p>{% endif %}
</footer>

</body>
</html>
