# Публичная витрина каналов (T-61). Сервис на 127.0.0.1:8502, systemd-юнит
# wow-showcase. Сайт поднят под noindex: переключатель — SHOWCASE_NOINDEX в
# /opt/wow_public_showcase/.env, снимается отдельным действием после встречи
# с Максимом, а не правкой этого файла.

# Запрос с чужим или пустым Host не должен попадать ни в один из сайтов:
# витрина стоит первой по алфавиту в sites-enabled и иначе стала бы дефолтной.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name fomobase.ru www.fomobase.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://fomobase.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.fomobase.ru;

    ssl_certificate     /etc/letsencrypt/live/fomobase.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fomobase.ru/privkey.pem;

    # У страницы один адрес: два живых хоста — это те же страницы-клоны,
    # из-за которых мы приводим имя канала к нижнему регистру.
    return 301 https://fomobase.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fomobase.ru;

    ssl_certificate     /etc/letsencrypt/live/fomobase.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fomobase.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Файл подтверждения прав в Вебмастере и Search Console. Стоит ДО прокси:
    # в приложении есть catch-all /{platform}, и он ответил бы на этот адрес
    # страницей 404 раньше, чем файл нашёлся бы на диске.
    location ~ ^/(yandex_[0-9a-zA-Z]+\.html|google[0-9a-zA-Z]+\.html)$ {
        root /var/www/fomobase;
        access_log off;
    }

    # Аватарки лежат у коллектора и в дамп не копируются: миллион мелких
    # файлов удвоил бы занятое место, а места на этом разделе и так нет.
    location /avatars/ {
        alias /opt/datacollector/data/avatars/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Robots-Tag "noindex" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8502;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # Данные меняются раз в сутки, а обход краулером идёт сотнями тысяч
        # страниц подряд: без кэша каждая из них была бы отдельным походом в
        # базу. Ошибку кэшируем ненадолго, чтобы 404 не залипала на сутки.
        proxy_cache fomobase;
        proxy_cache_key "$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_valid 301 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
    }
}
