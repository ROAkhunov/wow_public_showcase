# Кэш публичной витрины: данные меняются раз в сутки, а обход краулером — это
# сотни тысяч страниц подряд. Отдельная зона, чтобы не мешать другим сайтам.
proxy_cache_path /var/cache/nginx/fomobase levels=1:2 keys_zone=fomobase:32m
                 max_size=2g inactive=24h use_temp_path=off;

# ── Фильтрованные адреса (T-65) ──────────────────────────────────────────────
# Строка запроса в `location` не матчится, поэтому и отключение кэша, и лимит
# запросов задаются картой по аргументам. В карте — БЕЛЫЙ СПИСОК ключей, тот же
# самый, что в нормализации адреса на стороне сервиса. Карта вида «любые
# параметры» выключила бы кэш заодно у `?page`, а это главный путь краулера к
# 140 тысячам страниц и главный потребитель кэша.
#
# Лента (`?posts`) сюда входит намеренно: адресов у неё около 170 тысяч, больше
# чем страниц каналов, и в кэше на 2 ГБ они вытеснили бы карточки. Краулер туда
# не ходит (nofollow плюс robots.txt), а человек жмёт «Ещё» редко.
map $args $fomobase_filtered {
    default                                   "";
    "~(^|&)(subs_min|subs_max)="              "1";
    "~(^|&)(views_min|views_max)="            "1";
    "~(^|&)(ads_min|ads_max)="                "1";
    "~(^|&)(has_ads|has_siblings)="           "1";
    "~(^|&)(cat|sort|posts)="                 "1";
}

# Ключ зоны пуст для нефильтрованных запросов, и лимит на них не действует:
# nginx пропускает запросы с пустым ключом мимо счётчика. Так узкий лимит
# ложится ровно на перебор фильтров, не задевая обход каталога.
map $fomobase_filtered $fomobase_limit_key {
    default "";
    "1"     $binary_remote_addr;
}
limit_req_zone $fomobase_limit_key zone=fomobase_filters:10m rate=20r/m;
